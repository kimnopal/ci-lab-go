name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exit-code-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 succeeds
        run: echo "step 1"

      - name: Step 2 fails intentionally
        run: exit 1

      - name: Step 3 should not run
        run: echo "you should not see this"
